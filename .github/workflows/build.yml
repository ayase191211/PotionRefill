name: Build 1.18.2

on:
  push:
    branches: ["1.18.2-fabric"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Show jar contents
        run: |
          ls -l build/libs
          unzip -l build/libs/potionrefill-1.0-1.18.2.jar
      - uses: actions/upload-artifact@v4
        with:
          name: potionrefill-1.18.2
          path: build/libs/*.jar
